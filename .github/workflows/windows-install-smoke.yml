name: Existing Windows package installation and UI acceptance

on:
  workflow_call:
    inputs:
      package_run_id:
        description: 'Same-repository release run containing the exact installer artifact to inspect'
        type: string
        required: true
      run_task_execution:
        description: 'Run real installed task tools, HTML file verification and daily schedule readback with a local model protocol fixture'
        type: boolean
        required: false
        default: false
      run_mirror_acceptance:
        description: 'Check cold official marketplace installs, local Playwright navigation, Docling startup and Video Shotcraft selection on the exact Windows installer.'
        type: boolean
        required: false
        default: false
      run_docling_conversion:
        description: 'Install a pinned temporary Docling Serve backend, then convert and read back synthetic PDF and DOCX through the exact installed Docling MCP alongside Superpowers and Blender skill calls.'
        type: boolean
        required: false
        default: false
      run_browser_startup_diagnostic:
        description: 'Collect isolated pinned daemon startup diagnostics only; no application, model or task execution'
        type: boolean
        required: false
        default: false
      run_browser_execution:
        description: 'Load the fixed official BrowserSkill extension in isolated Chrome for Testing and read a controlled page through real task tools'
        type: boolean
        required: false
        default: false
      run_startup_appearance:
        description: 'Capture the real startup window in the exact installed package and verify theme and scaling.'
        type: boolean
        required: false
        default: false
      run_composer_acceptance:
        description: 'Exercise installed chat attachment intake, PDF reading, and Skill and plugin selection.'
        type: boolean
        required: false
        default: false
      run_windows_spreadsheet:
        description: 'Run the exact installed Windows package through the offline Univer workbook and XLSX preview journey.'
        type: boolean
        required: false
        default: false
      run_task_pause_restart:
        description: 'Pause the installed PPT task at its open question, restart the exact package with the same isolated profile, and continue in the original conversation.'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Same-repository release run containing the exact installer artifact to inspect'
        type: string
        required: false
      run_mac_startup_appearance:
        description: 'Run exact startup checks on signed Apple Silicon and Intel installers from the selected release build.'
        type: boolean
        required: false
        default: false
      web_ppt_journey:
        description: 'Run the website-to-PPTX journey. Browser-fallback uses an isolated Windows Chrome extension. Live mode requires QA model credentials.'
        type: choice
        options: ['off', controlled, live, browser-fallback]
        default: 'off'
      run_published_gui_update:
        description: 'Install the exact released baseline and upgrade from the app sidebar over the live Stable feed on an ephemeral Windows runner'
        type: boolean
        required: false
        default: false
      published_gui_upgrade_scenario:
        description: 'Pinned official pair for the live Windows sidebar upgrade'
        type: choice
        options:
          - released-056-to-057
          - released-057-to-059
        default: released-056-to-057
      published_gui_verify_overlay:
        description: 'After a demonstrated 0.5.7 sidebar failure, separately verify in-place installation with a synthetic profile'
        type: boolean
        required: false
        default: false
      run_frozen_gui_update:
        description: 'Install official 0.5.7 then test the exact frozen 0.5.8 installer with a runner-only HTTPS update feed and installed profile continuity.'
        type: boolean
        required: false
        default: false
      upgrade_058_to_candidate:
        description: 'Exercise both GUI paths from the released 0.5.8 to the same exact 0.5.9 candidate over private HTTPS.'
        type: boolean
        required: false
        default: false
      upgrade_059_to_candidate:
        description: 'Exercise both GUI paths from the released 0.5.9 to the same exact 0.5.10 candidate over private HTTPS.'
        type: boolean
        required: false
        default: false
      upgrade_0510_to_candidate:
        description: 'Exercise both GUI paths from the released 0.5.10 to the exact 0.5.11 candidate over private HTTPS.'
        type: boolean
        required: false
        default: false
      overlay_057_to_candidate:
        description: 'Install the exact 0.5.11 candidate over released 0.5.7, then reopen the seeded profile.'
        type: boolean
        required: false
        default: false
      run_startup_appearance:
        description: 'Capture the real startup window in the exact installed package and verify theme and scaling.'
        type: boolean
        required: false
        default: false
      run_composer_acceptance:
        description: 'Exercise installed chat attachment intake, PDF reading, and Skill and plugin selection.'
        type: boolean
        required: false
        default: false
      run_windows_spreadsheet:
        description: 'Run the exact installed Windows package through the offline Univer workbook and XLSX preview journey.'
        type: boolean
        required: false
        default: false
      run_task_pause_restart:
        description: 'Pause the installed PPT task at its open question, restart the exact package with the same isolated profile, and continue in the original conversation.'
        type: boolean
        required: false
        default: false
      build_private_next:
        description: 'In the frozen update test only, build a temporary 0.5.9 NSIS fixture from this exact source, exercise the next native upgrade and discard the fixture.'
        type: boolean
        required: false
        default: true
      run_repaired_gui_update:
        description: 'Build a private 0.5.6 updater fixture from this ref and exercise its warm-check upgrade to released Stable 0.5.7'
        type: boolean
        required: false
        default: false
      run_repaired_marketplace_install:
        description: 'Build a private Windows fixture from this ref and verify the real Playwright MCP catalog installation'
        type: boolean
        required: false
        default: false
      run_task_execution:
        description: 'Run real installed task tools, HTML file verification and daily schedule readback with a local model protocol fixture'
        type: boolean
        required: false
        default: false
      run_mirror_acceptance:
        description: 'Check cold official marketplace installs, local Playwright navigation, Docling startup and Video Shotcraft selection on the exact Windows installer.'
        type: boolean
        required: false
        default: false
      run_docling_conversion:
        description: 'Install a pinned temporary Docling Serve backend, then convert and read back synthetic PDF and DOCX through the exact installed Docling MCP alongside Superpowers and Blender skill calls.'
        type: boolean
        required: false
        default: false
      run_private_video_evaluation:
        description: 'Privately evaluate the installed Video Shotcraft Skill using separately provisioned Remotion and synthetic media. No license or binaries are distributed.'
        type: boolean
        required: false
        default: false
      run_browser_startup_diagnostic:
        description: 'Collect isolated pinned daemon startup diagnostics only; no application, model or task execution'
        type: boolean
        required: false
        default: false
      run_browser_execution:
        description: 'Load the fixed official BrowserSkill extension in isolated Chrome for Testing and read a controlled page through real task tools'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  windows-install:
    if: ${{ (inputs.run_mac_startup_appearance != true || inputs.run_startup_appearance == true || inputs.web_ppt_journey == 'browser-fallback') && inputs.run_frozen_gui_update != true && inputs.run_published_gui_update != true && inputs.run_repaired_gui_update != true && inputs.run_repaired_marketplace_install != true }}
    name: ${{ inputs.run_browser_startup_diagnostic && 'Diagnose the existing package browser startup only' || 'Install and inspect the existing Windows package' }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.run_docling_conversion && 110 || inputs.run_private_video_evaluation && 75 || inputs.run_mirror_acceptance && 65 || inputs.run_task_pause_restart && 35 || (contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey) || inputs.run_composer_acceptance || inputs.run_windows_spreadsheet) && 35 || (inputs.run_browser_execution || inputs.run_startup_appearance) && 25 || 15 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject mixed diagnostic and business acceptance modes
        if: inputs.run_browser_startup_diagnostic && (inputs.run_task_execution || inputs.run_browser_execution || inputs.run_composer_acceptance || inputs.run_task_pause_restart || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey))
        run: throw 'Browser startup diagnostic is exclusive with task and browser execution'
      - name: Keep pause and restart recovery isolated
        if: inputs.run_task_pause_restart && (inputs.run_browser_startup_diagnostic || inputs.run_task_execution || inputs.run_browser_execution || inputs.run_composer_acceptance || inputs.run_mirror_acceptance || inputs.run_docling_conversion || inputs.run_private_video_evaluation || inputs.run_windows_spreadsheet || inputs.run_startup_appearance || inputs.web_ppt_journey != 'off')
        run: throw 'Pause and restart recovery uses its own clean installed application profile'
      - name: Keep the Windows spreadsheet acceptance isolated
        if: inputs.run_windows_spreadsheet && (inputs.run_browser_startup_diagnostic || inputs.run_task_execution || inputs.run_browser_execution || inputs.run_composer_acceptance || inputs.run_startup_appearance || inputs.run_mirror_acceptance || inputs.run_docling_conversion || inputs.run_private_video_evaluation || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey))
        run: throw 'Windows spreadsheet acceptance uses its own clean installed application profile'
      - name: Preserve the isolated cold marketplace profile
        if: (inputs.run_mirror_acceptance || inputs.run_private_video_evaluation) && (inputs.run_browser_startup_diagnostic || inputs.run_task_execution || inputs.run_browser_execution || inputs.run_composer_acceptance || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey))
        run: throw 'Cold marketplace acceptance must use its own clean profile'
      - name: Preserve the isolated focused marketplace profile
        if: inputs.run_docling_conversion && (inputs.run_mirror_acceptance || inputs.run_private_video_evaluation || inputs.run_browser_startup_diagnostic || inputs.run_task_execution || inputs.run_browser_execution || inputs.run_composer_acceptance || inputs.run_startup_appearance || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey))
        run: throw 'Focused marketplace acceptance must use its own clean profile'
      - name: Require the original package build ID
        if: ${{ inputs.package_run_id == '' }}
        run: throw 'package_run_id is required to inspect an existing package'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@v6
        if: inputs.run_docling_conversion
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: npm ci --ignore-scripts
      - name: Prepare isolated pinned Docling Serve conversion backend
        if: inputs.run_docling_conversion
        shell: pwsh
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'railwise-docling-serve'
          python -m venv $environment
          $python = Join-Path $environment 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check 'docling-serve==1.39.0'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Docling Serve installation failed' }
          $identity = & $python -c "import importlib.metadata as m, platform; print(m.version('docling-serve') + '|' + platform.python_version())"
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch '^1\.39\.0\|3\.11\.') { throw "Unexpected Docling Serve test backend: $identity" }
          "RAILWISE_DOCLING_SERVE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Verify Windows acceptance contracts and PowerShell syntax
        run: node --test scripts/windows-install-smoke.test.mjs scripts/windows-ui-smoke.test.mjs scripts/run-windows-offline-spreadsheet-journey.test.mjs scripts/prepare-windows-install-smoke.test.mjs scripts/prepare-browser-skill-smoke.test.mjs
      - name: Verify the original build and unchanged application source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          WORKWISE_WINDOWS_SMOKE_SOURCE_FILE: ${{ runner.temp }}/windows-package-source.json
        run: node scripts/prepare-windows-install-smoke.mjs "$env:PACKAGE_RUN_ID" "$env:WORKWISE_WINDOWS_SMOKE_SOURCE_FILE"
      - name: Download the verified immutable Windows artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/exact-windows-packages
      - name: Install, inspect the Chinese UI and uninstall the temporary instance
        env:
          PACKAGE_SOURCE_HEAD: ${{ steps.source.outputs.package_source_head }}
          WORKWISE_WINDOWS_SMOKE_SOURCE_FILE: ${{ runner.temp }}/windows-package-source.json
          RAILWISE_WINDOWS_BROWSER_STARTUP_DIAGNOSTIC: ${{ inputs.run_browser_startup_diagnostic }}
          RAILWISE_WINDOWS_TASK_SMOKE: ${{ inputs.run_task_execution }}
          RAILWISE_WINDOWS_BROWSER_SMOKE: ${{ inputs.run_browser_execution }}
          RAILWISE_WINDOWS_MIRROR_SMOKE: ${{ inputs.run_mirror_acceptance }}
          RAILWISE_WINDOWS_DOCLING_CONVERSION: ${{ inputs.run_docling_conversion }}
          RAILWISE_WINDOWS_VIDEO_EVALUATION: ${{ inputs.run_private_video_evaluation }}
          RAILWISE_WINDOWS_STARTUP_APPEARANCE_SMOKE: ${{ inputs.run_startup_appearance }}
          RAILWISE_WINDOWS_COMPOSER_SMOKE: ${{ inputs.run_composer_acceptance }}
          RAILWISE_WINDOWS_TASK_PAUSE_RESTART: ${{ inputs.run_task_pause_restart }}
          RAILWISE_WINDOWS_WEB_PPT_SMOKE: ${{ inputs.run_task_pause_restart || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey) }}
          RAILWISE_WINDOWS_WEB_PPT_BROWSER_FALLBACK: ${{ inputs.web_ppt_journey == 'browser-fallback' }}
          RAILWISE_WINDOWS_WEB_PPT_LIVE: ${{ inputs.web_ppt_journey == 'live' }}
          RAILWISE_WINDOWS_SPREADSHEET_SMOKE: ${{ inputs.run_windows_spreadsheet }}
          RAILWISE_QA_MODEL_BASE_URL: ${{ inputs.web_ppt_journey == 'live' && (secrets.RAILWISE_QA_MODEL_BASE_URL || vars.RAILWISE_QA_MODEL_BASE_URL) || '' }}
          RAILWISE_QA_MODEL: ${{ inputs.web_ppt_journey == 'live' && (secrets.RAILWISE_QA_MODEL || vars.RAILWISE_QA_MODEL) || '' }}
          RAILWISE_QA_MODEL_API_KEY: ${{ inputs.web_ppt_journey == 'live' && secrets.RAILWISE_QA_MODEL_API_KEY || '' }}
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'exact-windows-packages'
          $installers = @(Get-ChildItem -LiteralPath $packages -Filter '*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -notmatch '^RailWise-AI-(\d+\.\d+\.\d+)-win-x64\.exe$') {
            throw 'Expected one exact versioned RailWise AI installer'
          }
          ./scripts/run-windows-install-smoke.ps1 `
            -Installer $installers[0].FullName `
            -Version $Matches[1] `
            -SourceHead $env:PACKAGE_SOURCE_HEAD `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'exact-windows-evidence')
      - name: Record verified installed journeys
        run: node scripts/record-core-journeys.mjs windows "$env:RUNNER_TEMP/exact-windows-evidence"
      - name: Retain package identity and actual Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-package-windows-install-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/exact-windows-evidence/
            ${{ runner.temp }}/windows-package-source.json

  windows-frozen-gui-update:
    if: ${{ inputs.run_frozen_gui_update == true || inputs.upgrade_058_to_candidate == true || inputs.upgrade_059_to_candidate == true || inputs.upgrade_0510_to_candidate == true || inputs.overlay_057_to_candidate == true }}
    name: ${{ matrix.entry == 'overlay' && 'Official 0.5.7 to exact candidate' || inputs.upgrade_0510_to_candidate && 'Official 0.5.10 to exact candidate' || inputs.upgrade_059_to_candidate && 'Official 0.5.9 to exact candidate' || inputs.upgrade_058_to_candidate && 'Official 0.5.8 to exact candidate' || 'Official 0.5.7 to exact frozen 0.5.8' }} (${{ matrix.entry }})
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.overlay_057_to_candidate && inputs.upgrade_0510_to_candidate && '["overlay","sidebar","settings"]' || inputs.overlay_057_to_candidate && '["overlay"]' || (inputs.upgrade_058_to_candidate || inputs.upgrade_059_to_candidate || inputs.upgrade_0510_to_candidate) && '["sidebar","settings"]' || '["sidebar"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exclusive acceptance scope
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          OVERLAY_BASELINE: ${{ inputs.run_frozen_gui_update }}
          OVERLAY_0511: ${{ inputs.overlay_057_to_candidate }}
          UPGRADE_058: ${{ inputs.upgrade_058_to_candidate }}
          UPGRADE_059: ${{ inputs.upgrade_059_to_candidate }}
          UPGRADE_0510: ${{ inputs.upgrade_0510_to_candidate }}
          HAS_OTHER_CASE: ${{ inputs.run_composer_acceptance || inputs.run_published_gui_update || inputs.run_repaired_gui_update || inputs.run_repaired_marketplace_install || inputs.run_task_execution || inputs.run_browser_startup_diagnostic || inputs.run_browser_execution || inputs.run_mirror_acceptance || inputs.run_private_video_evaluation || contains(fromJSON('["controlled","live","browser-fallback"]'), inputs.web_ppt_journey) }}
        run: |
          $selected = @(@($env:OVERLAY_BASELINE, $env:OVERLAY_0511, $env:UPGRADE_058, $env:UPGRADE_059, $env:UPGRADE_0510) | Where-Object { $_ -eq 'true' })
          $validSelection = $selected.Count -eq 1 -or ($selected.Count -eq 2 -and $env:OVERLAY_0511 -eq 'true' -and $env:UPGRADE_0510 -eq 'true')
          if (!$env:PACKAGE_RUN_ID -or !$validSelection -or $env:HAS_OTHER_CASE -eq 'true') {
            throw 'Select one original frozen package run and optional private next package run'
          }
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: node --test scripts/windows-published-gui-update-smoke.test.mjs scripts/prepare-windows-install-smoke.test.mjs
      - name: Resolve the frozen Windows installer artifact
        id: frozen
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: node scripts/prepare-windows-install-smoke.mjs "$env:PACKAGE_RUN_ID" "$env:RUNNER_TEMP/frozen-windows-source.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.frozen.outputs.artifact_id }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/frozen-windows
      - name: Prepare checksummed Electron runtime for the private fixture
        if: ${{ inputs.build_private_next && inputs.run_frozen_gui_update }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm run prepare:electron
      - name: Reuse the original build's Windows document sidecar
        if: ${{ inputs.build_private_next && inputs.run_frozen_gui_update }}
        uses: actions/download-artifact@v4
        with:
          name: markitdown-win32-x64
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          path: build/sidecars/markitdown-win32-x64
      - name: Verify the reused Windows document sidecar
        if: ${{ inputs.build_private_next && inputs.run_frozen_gui_update }}
        env:
          WORKWISE_SIDECAR_ARCH: x64
        run: node scripts/build-markitdown-sidecar.mjs --verify-only
      - name: Build the runner-local higher-version NSIS fixture
        if: ${{ inputs.build_private_next && inputs.run_frozen_gui_update }}
        env:
          WORKWISE_APP_VERSION: '0.5.9'
          WORKWISE_CANDIDATE_SOURCE_HEAD: ${{ github.sha }}
          WORKWISE_REQUIRE_DOCUMENT_SIDECAR: '1'
          WORKWISE_UPDATE_CHANNEL: stable
          WORKWISE_DIST_DIR: ${{ runner.temp }}/private-next-windows
          RELEASE_CHANNEL: stable
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run dist:win
      - name: Exercise native update or the exact overlay fallback and reopen the existing conversation
        env:
          INCLUDE_PRIVATE_NEXT: ${{ inputs.build_private_next && inputs.run_frozen_gui_update }}
          CANDIDATE_UPGRADE_ENTRY: ${{ (inputs.upgrade_058_to_candidate || inputs.upgrade_059_to_candidate || inputs.upgrade_0510_to_candidate || inputs.overlay_057_to_candidate) && matrix.entry || '' }}
          CANDIDATE_UPGRADE_BASELINE: ${{ matrix.entry != 'overlay' && inputs.upgrade_0510_to_candidate && '0.5.10' || matrix.entry != 'overlay' && inputs.upgrade_059_to_candidate && '0.5.9' || '' }}
        run: |
          $arguments = @("$env:RUNNER_TEMP/frozen-windows", "$env:RUNNER_TEMP/frozen-windows-source.json", "$env:RUNNER_TEMP/frozen-windows-evidence")
          if ($env:CANDIDATE_UPGRADE_ENTRY) { $arguments += $env:CANDIDATE_UPGRADE_ENTRY }
          if ($env:CANDIDATE_UPGRADE_BASELINE) { $arguments += $env:CANDIDATE_UPGRADE_BASELINE }
          if ($env:INCLUDE_PRIVATE_NEXT -eq 'true') {
            @{ packageSourceHead=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; purpose='private-next-updater-fixture' } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/private-next-windows-source.json"
            $arguments += @("$env:RUNNER_TEMP/private-next-windows", "$env:RUNNER_TEMP/private-next-windows-source.json", '0.5.9')
          }
          node scripts/run-windows-frozen-gui-upgrade.mjs @arguments
      - name: Record verified updater journey
        if: ${{ inputs.upgrade_0510_to_candidate || inputs.overlay_057_to_candidate }}
        env:
          ENTRY: ${{ matrix.entry }}
        run: node scripts/record-core-journeys.mjs windows-upgrade "$env:RUNNER_TEMP/frozen-windows-evidence" "$env:ENTRY"
      - name: Retain exact-package Windows updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-windows-gui-upgrade-${{ github.run_id }}${{ (inputs.upgrade_058_to_candidate || inputs.upgrade_059_to_candidate || inputs.upgrade_0510_to_candidate || inputs.overlay_057_to_candidate) && format('-{0}', matrix.entry) || '' }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/frozen-windows-evidence/

  windows-published-gui-update:
    if: ${{ inputs.run_published_gui_update == true && inputs.run_frozen_gui_update != true }}
    name: Released Windows sidebar upgrade (${{ inputs.published_gui_upgrade_scenario || 'released-056-to-057' }})
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject mixed acceptance modes
        if: ${{ inputs.run_repaired_gui_update || inputs.run_repaired_marketplace_install || inputs.package_run_id != '' || inputs.run_task_execution || inputs.run_browser_startup_diagnostic || inputs.run_browser_execution }}
        run: throw 'The published GUI upgrade accepts no package build or other smoke mode'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install verification tools
        run: npm ci --ignore-scripts
      - name: Verify the published GUI upgrade contract
        run: node --test scripts/windows-published-gui-update-smoke.test.mjs scripts/windows-install-smoke.test.mjs
      - name: Install the released baseline and upgrade through the packaged UI
        env:
          PUBLISHED_GUI_UPGRADE_SCENARIO: ${{ inputs.published_gui_upgrade_scenario || 'released-056-to-057' }}
          PUBLISHED_GUI_VERIFY_OVERLAY: ${{ inputs.published_gui_verify_overlay }}
        run: node scripts/run-windows-published-gui-update-smoke.mjs
      - name: Retain actual updater evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-windows-gui-upgrade-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/published-windows-gui-upgrade-evidence/

  exact-mac-startup-appearance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mac_startup_appearance == true }}
    name: Exact startup appearance on macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.web_ppt_journey == 'live' && 45 || inputs.web_ppt_journey == 'controlled' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      EXACT_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install verification tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify startup acceptance contracts
        run: node --test scripts/verify-windows-startup-appearance.test.mjs scripts/run-mac-ppt-journey.test.mjs scripts/run-mac-offline-spreadsheet-journey.test.mjs
      - name: Resolve the immutable macOS release artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: node scripts/run-mac-startup-appearance-smoke.mjs --prepare "$PACKAGE_RUN_ID" "$RUNNER_TEMP/exact-mac-source.json" "$EXACT_MAC_ARCH"
      - name: Download the precise installer artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/exact-mac-packages
      - name: Register a native PPTX handler for the installed-artifact smoke
        if: ${{ matrix.arch == 'arm64' && (inputs.web_ppt_journey == 'controlled' || inputs.web_ppt_journey == 'live') }}
        run: |
          brew install --cask libreoffice
          brew install duti
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/LibreOffice.app
          duti -s org.libreoffice.script pptx all
          test "$(duti -x pptx | head -n 1)" = "LibreOffice"
      - name: Inspect the signed installed application and real startup surfaces
        env:
          RAILWISE_MAC_PPT_JOURNEY: ${{ matrix.arch == 'arm64' && (inputs.web_ppt_journey == 'controlled' || inputs.web_ppt_journey == 'live') && inputs.web_ppt_journey || '' }}
          RAILWISE_QA_MODEL_BASE_URL: ${{ matrix.arch == 'arm64' && inputs.web_ppt_journey == 'live' && (secrets.RAILWISE_QA_MODEL_BASE_URL || vars.RAILWISE_QA_MODEL_BASE_URL) || '' }}
          RAILWISE_QA_MODEL: ${{ matrix.arch == 'arm64' && inputs.web_ppt_journey == 'live' && (secrets.RAILWISE_QA_MODEL || vars.RAILWISE_QA_MODEL) || '' }}
          RAILWISE_QA_MODEL_API_KEY: ${{ matrix.arch == 'arm64' && inputs.web_ppt_journey == 'live' && secrets.RAILWISE_QA_MODEL_API_KEY || '' }}
        run: >-
          node scripts/run-mac-startup-appearance-smoke.mjs --run
          "$RUNNER_TEMP/exact-mac-packages" "$RUNNER_TEMP/exact-mac-source.json"
          "$RUNNER_TEMP/exact-mac-evidence" "$EXACT_MAC_ARCH"
      - name: Retain the exact macOS installer and startup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-mac-startup-appearance-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/exact-mac-source.json
            ${{ runner.temp }}/exact-mac-evidence/mac-startup-appearance.json
            ${{ runner.temp }}/exact-mac-evidence/mac-offline-spreadsheet.json
            ${{ runner.temp }}/exact-mac-evidence/core-journeys.json
            ${{ runner.temp }}/exact-mac-evidence/mac-ppt-journey-*.json
            ${{ runner.temp }}/exact-mac-evidence/mac-offline-spreadsheet-*.png
            ${{ runner.temp }}/exact-mac-evidence/mac-startup-*.png

  windows-repaired-gui-update:
    if: ${{ (inputs.run_repaired_gui_update == true || inputs.run_repaired_marketplace_install == true) && inputs.run_published_gui_update != true && inputs.run_frozen_gui_update != true }}
    name: ${{ inputs.run_repaired_marketplace_install && 'Private Windows npm marketplace install' || 'Private repaired Windows baseline to released Stable 0.5.7' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject mixed acceptance modes
        if: ${{ (inputs.run_repaired_gui_update && inputs.run_repaired_marketplace_install) || inputs.package_run_id != '' || inputs.run_task_execution || inputs.run_browser_startup_diagnostic || inputs.run_browser_execution }}
        run: throw 'Select one private repaired fixture mode without other smoke options'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install fixture build tools
        run: npm ci
      - name: Verify the GUI upgrade contract
        run: node --test scripts/windows-published-gui-update-smoke.test.mjs scripts/windows-install-smoke.test.mjs
      - name: Prepare checksummed Electron runtime
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm run prepare:electron
      - name: Restore pinned Windows document sidecar from the reviewed release build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14376543672'
          run-id: '44192481166'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/sidecars/markitdown-win32-x64
      - name: Verify Windows sidecar
        env:
          WORKWISE_SIDECAR_ARCH: x64
        run: node scripts/build-markitdown-sidecar.mjs --verify-only
      - name: Build the local-only repaired baseline NSIS installer
        env:
          WORKWISE_APP_VERSION: '0.5.6'
          WORKWISE_CANDIDATE_SOURCE_HEAD: ${{ github.sha }}
          WORKWISE_REQUIRE_DOCUMENT_SIDECAR: '1'
          WORKWISE_UPDATE_CHANNEL: stable
          WORKWISE_DIST_DIR: ${{ runner.temp }}/repaired-updater-baseline
          RELEASE_CHANNEL: stable
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=6144
        # dist:win uses electron-builder --publish never.
        run: npm run dist:win
      - name: Verify packaged Windows Runtime and document sidecar
        run: |
          node scripts/verify-packaged-markitdown.cjs "$env:RUNNER_TEMP/repaired-updater-baseline" win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-packaged-runtime-native.cjs "$env:RUNNER_TEMP/repaired-updater-baseline" win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upgrade the repaired baseline through the real packaged sidebar
        if: inputs.run_repaired_gui_update
        run: node scripts/run-windows-published-gui-update-smoke.mjs --repaired-baseline
      - name: Install the reviewed Playwright MCP package with native npm
        if: inputs.run_repaired_marketplace_install
        run: node scripts/run-windows-published-gui-update-smoke.mjs --repaired-marketplace
      - name: Retain diagnostics for the private repaired baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-windows-gui-upgrade-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/published-windows-gui-upgrade-evidence/
