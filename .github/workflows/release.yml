name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      private_updater_acceptance:
        description: 'Only run signed candidate native updater acceptance over runner-local private HTTPS. No public uploads, releases, feeds or website changes.'
        required: false
        type: boolean
        default: false
      isolated_survey_candidate:
        description: 'Only build a separately identified, signed/notarized Survey candidate as an authenticated Actions artifact. Never publish a release or feed.'
        required: false
        type: boolean
        default: false
      candidate_only:
        description: 'Build and verify all three clients without creating or updating a GitHub Release.'
        required: false
        type: boolean
        default: true
      skip_stability:
        description: 'Emergency release: skip the two-hour pre-release stability gate after quality checks have passed.'
        required: false
        type: boolean
        default: false
      run_updater_acceptance:
        description: 'Run only the isolated native updater acceptance workflow.'
        required: false
        type: boolean
        default: false
      acceptance_base_version:
        description: 'Installed baseline version for native updater acceptance.'
        required: false
        type: string
        default: '0.3.5'
      acceptance_target_version:
        description: 'Temporary target version for native updater acceptance.'
        required: false
        type: string
        default: '0.3.6'
      cleanup_acceptance_run_id:
        description: 'Cleanup only: exact updater acceptance run id to remove from R2 and the official website.'
        required: false
        type: string
        default: ''
      repair_website_cache:
        description: 'Run only the scoped WorkWise updater metadata cache repair workflow.'
        required: false
        type: boolean
        default: false
      repair_website_cache_mode:
        description: 'Inspect or apply the scoped OpenResty cache rule.'
        required: false
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      repair_website_cache_confirmation:
        description: 'For apply, enter REPAIR-WORKWISE-METADATA-CACHE.'
        required: false
        type: string
        default: ''
      rollback_stable_tag:
        description: 'Emergency only: existing immutable tag to restore as Stable, for example v0.3.5.'
        required: false
        type: string
        default: ''
      rollback_stable_confirmation:
        description: 'Enter ROLLBACK-STABLE-TO-vX.Y.Z using the exact rollback tag.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.0'
  RELEASE_CHANNEL: stable
  WORKWISE_DOWNLOAD_URL: https://www.railwise.cn/products/workwise/
  WORKWISE_UPDATE_PROVIDER: generic
  WORKWISE_UPDATE_BASE_URL: https://www.railwise.cn/downloads
  WORKWISE_GITHUB_REPO: railwise-cn/railwise-ai

jobs:
  private-updater-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/private-updater-acceptance.yml
    secrets: inherit

  isolated-survey-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance != true && inputs.isolated_survey_candidate == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/isolated-survey-candidate.yml
    secrets: inherit

  native-updater-acceptance:
    name: Native updater acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance != true && inputs.isolated_survey_candidate != true && inputs.run_updater_acceptance == true && inputs.cleanup_acceptance_run_id == '' }}
    uses: ./.github/workflows/updater-acceptance-e2e.yml
    with:
      base_version: ${{ inputs.acceptance_base_version }}
      target_version: ${{ inputs.acceptance_target_version }}
    secrets: inherit

  cleanup-updater-acceptance:
    name: Cleanup updater acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance != true && inputs.isolated_survey_candidate != true && inputs.cleanup_acceptance_run_id != '' }}
    uses: ./.github/workflows/updater-acceptance-cleanup.yml
    with:
      run_id: ${{ inputs.cleanup_acceptance_run_id }}
    secrets: inherit

  repair-website-cache:
    name: Repair website updater metadata cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance != true && inputs.isolated_survey_candidate != true && inputs.repair_website_cache == true && (inputs.repair_website_cache_mode == 'inspect' || inputs.repair_website_cache_confirmation == 'REPAIR-WORKWISE-METADATA-CACHE') }}
    runs-on: ubuntu-latest
    env:
      WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
      WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
      WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
      WORKWISE_WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WORKWISE_WEBSITE_SSH_PRIVATE_KEY }}
      WORKWISE_WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS }}
      WORKWISE_PUBLIC_BASE_URL: https://www.railwise.cn/downloads
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Prepare pinned website SSH transport
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/workwise-website-ssh"
          install -d -m 700 "${ssh_dir}"
          export SSH_KEY_PATH="${ssh_dir}/deploy-key"
          export SSH_KNOWN_HOSTS_PATH="${ssh_dir}/known_hosts"
          node - <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.SSH_KEY_PATH, `${process.env.WORKWISE_WEBSITE_SSH_PRIVATE_KEY.trim()}\n`, { mode: 0o600 })
          fs.writeFileSync(process.env.SSH_KNOWN_HOSTS_PATH, `${process.env.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS.trim()}\n`, { mode: 0o600 })
          NODE
          {
            echo "WORKWISE_WEBSITE_SSH_KEY_PATH=${SSH_KEY_PATH}"
            echo "WORKWISE_WEBSITE_SSH_KNOWN_HOSTS_PATH=${SSH_KNOWN_HOSTS_PATH}"
          } >> "${GITHUB_ENV}"
      - name: Inspect or apply scoped OpenResty rule
        env:
          MODE: ${{ inputs.repair_website_cache_mode }}
        run: node scripts/repair-website-cache.mjs "${MODE}"
      - name: Verify public metadata headers after apply
        if: ${{ inputs.repair_website_cache_mode == 'apply' }}
        run: |
          node scripts/deploy-website-release.mjs verify-metadata-cache \
            --channel stable \
            --release-prefix workwise

  rollback-stable:
    name: Roll back WorkWise Stable pointers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_updater_acceptance != true && inputs.isolated_survey_candidate != true && inputs.rollback_stable_tag != '' && inputs.rollback_stable_confirmation != '' }}
    runs-on: ubuntu-latest
    env:
      ROLLBACK_TAG: ${{ inputs.rollback_stable_tag }}
      ROLLBACK_CONFIRMATION: ${{ inputs.rollback_stable_confirmation }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
      WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
      WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
      WORKWISE_WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WORKWISE_WEBSITE_SSH_PRIVATE_KEY }}
      WORKWISE_WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS }}
      WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
      WORKWISE_PUBLIC_BASE_URL: https://www.railwise.cn/downloads
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install rollback dependencies
        run: npm ci --ignore-scripts
      - name: Validate exact rollback approval and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ROLLBACK_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::rollback_stable_tag must be an exact vX.Y.Z tag"
            exit 1
          }
          [[ "${ROLLBACK_CONFIRMATION}" == "ROLLBACK-STABLE-TO-${ROLLBACK_TAG}" ]] || {
            echo "::error::rollback confirmation does not match ${ROLLBACK_TAG}"
            exit 1
          }
          for name in \
            R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            WORKWISE_WEBSITE_SSH_HOST WORKWISE_WEBSITE_SSH_PORT WORKWISE_WEBSITE_SSH_USER \
            WORKWISE_WEBSITE_SSH_PRIVATE_KEY WORKWISE_WEBSITE_SSH_KNOWN_HOSTS WORKWISE_WEBSITE_RELEASE_ROOT; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing ${name}; Stable rollback is blocked"; exit 1; }
          done
      - name: Prepare pinned website SSH transport
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/workwise-website-ssh"
          install -d -m 700 "${ssh_dir}"
          export SSH_KEY_PATH="${ssh_dir}/deploy-key"
          export SSH_KNOWN_HOSTS_PATH="${ssh_dir}/known_hosts"
          node - <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.SSH_KEY_PATH, `${process.env.WORKWISE_WEBSITE_SSH_PRIVATE_KEY.trim()}\n`, { mode: 0o600 })
          fs.writeFileSync(process.env.SSH_KNOWN_HOSTS_PATH, `${process.env.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS.trim()}\n`, { mode: 0o600 })
          NODE
          {
            echo "WORKWISE_WEBSITE_SSH_KEY_PATH=${SSH_KEY_PATH}"
            echo "WORKWISE_WEBSITE_SSH_KNOWN_HOSTS_PATH=${SSH_KNOWN_HOSTS_PATH}"
          } >> "${GITHUB_ENV}"
      - name: Verify immutable rollback source
        run: node scripts/publish-r2.mjs verify --tag "${ROLLBACK_TAG}" --channel stable --platforms mac,win
      - name: Atomically restore R2 and website Stable pointers
        run: |
          set -euo pipefail
          node scripts/publish-r2.mjs rollback --tag "${ROLLBACK_TAG}" --channel stable --platforms mac,win
          node scripts/deploy-website-release.mjs promote \
            --tag "${ROLLBACK_TAG}" \
            --channel stable \
            --release-prefix workwise \
            --deploy-id "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify all public Stable manifests use the rollback version
        run: node scripts/verify-stable-feed-version.mjs "${ROLLBACK_TAG}"

  prepare:
    name: Prepare release version
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.private_updater_acceptance == true || inputs.isolated_survey_candidate == true || inputs.run_updater_acceptance == true || inputs.cleanup_acceptance_run_id != '' || inputs.repair_website_cache == true || inputs.rollback_stable_tag != '')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      existing_tag: ${{ steps.version.outputs.existing_tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Compute release version from tag
        id: version
        env:
          CANDIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_only == true }}
        run: |
          set -euo pipefail
          if [[ "${CANDIDATE_ONLY}" == "true" ]]; then
            node ./scripts/compute-ci-release-version.cjs --no-fetch --candidate
          else
            node ./scripts/compute-ci-release-version.cjs --no-fetch
          fi

  stability:
    name: Two-hour pre-release stability
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_stability == true) }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 130
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:stability
        env:
          WORKWISE_STABILITY_MINUTES: '120'
          WORKWISE_STABILITY_INTERVAL_MINUTES: '10'

  build-document-sidecars:
    name: MarkItDown ${{ matrix.platform }} ${{ matrix.arch }}
    if: ${{ always() && needs.prepare.result == 'success' && (needs.stability.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_stability == true)) }}
    needs: [prepare, stability]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            artifact: markitdown-darwin-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: markitdown-darwin-x64
          - runner: windows-latest
            platform: win32
            arch: x64
            artifact: markitdown-win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: sidecars/markitdown/requirements.lock
      - name: Install audited sidecar dependencies
        run: python -m pip install --disable-pip-version-check --requirement sidecars/markitdown/requirements.lock
      - name: Build native onedir sidecar
        run: npm run build:markitdown-sidecar
        env:
          WORKWISE_PYTHON: python
          WORKWISE_SIDECAR_ARCH: ${{ matrix.arch }}
      - name: Generate and verify dependency SBOM
        run: |
          python sidecars/markitdown/generate_sbom.py build/sidecars/${{ matrix.artifact }}/SBOM-python.json
          node scripts/verify-document-dependencies.mjs --python-sbom build/sidecars/${{ matrix.artifact }}/SBOM-python.json
          node scripts/build-markitdown-sidecar.mjs --verify-only
        env:
          WORKWISE_SIDECAR_ARCH: ${{ matrix.arch }}
      - name: Install PPT Master verifier dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Verify native PPT Master export/import roundtrip
        run: npm run verify:ppt-master-sidecar
        env:
          WORKWISE_SIDECAR_ARCH: ${{ matrix.arch }}
          WORKWISE_SIDECAR_PLATFORM: ${{ matrix.platform }}
      - name: Archive macOS sidecar with framework links and permissions
        if: ${{ matrix.platform == 'darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "build/sidecars/${{ matrix.artifact }}.tar.gz" \
            -C "build/sidecars/${{ matrix.artifact }}" .
      - name: Upload archived macOS sidecar
        if: ${{ matrix.platform == 'darwin' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: build/sidecars/${{ matrix.artifact }}.tar.gz
      - name: Upload native Windows sidecar
        if: ${{ matrix.platform == 'win32' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: build/sidecars/${{ matrix.artifact }}/

  build-macos:
    name: Build macOS
    if: ${{ always() && needs.build-document-sidecars.result == 'success' && (needs.stability.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_stability == true)) }}
    runs-on: macos-latest
    needs: [prepare, stability, build-document-sidecars]
    env:
      WORKWISE_APP_VERSION: ${{ needs.prepare.outputs.version }}
      WORKWISE_UPDATE_CHANNEL: ${{ inputs.candidate_only == true && 'frontier' || 'stable' }}
      WORKWISE_UPDATE_URL: ${{ inputs.candidate_only == true && 'https://127.0.0.1/' || '' }}
      WORKWISE_REQUIRE_DOCUMENT_SIDECAR: '1'
      RELEASE_CHANNEL: stable
      # Mapped to env so steps can branch on presence (secrets are not allowed
      # in step-level `if:` conditions). When the signing secrets are absent the
      # job builds an unsigned package instead of failing.
      MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Intel canvas binding is already present as an optional dependency
      # in package-lock.json. Re-installing it here triggers an npm Arborist
      # edgesOut crash on macOS runners and is unnecessary after npm ci.

      - name: Prepare checksummed Electron runtime
        run: npm run prepare:electron

      - name: Download Apple Silicon MarkItDown sidecar
        uses: actions/download-artifact@v4
        with:
          name: markitdown-darwin-arm64
          path: build/sidecars/archives

      - name: Download Intel MarkItDown sidecar
        uses: actions/download-artifact@v4
        with:
          name: markitdown-darwin-x64
          path: build/sidecars/archives

      - name: Restore macOS sidecars with framework links and permissions
        run: |
          set -euo pipefail
          mkdir -p build/sidecars/markitdown-darwin-arm64 build/sidecars/markitdown-darwin-x64
          tar -xzf build/sidecars/archives/markitdown-darwin-arm64.tar.gz -C build/sidecars/markitdown-darwin-arm64
          tar -xzf build/sidecars/archives/markitdown-darwin-x64.tar.gz -C build/sidecars/markitdown-darwin-x64
          test -L build/sidecars/markitdown-darwin-arm64/workwise-markitdown/_internal/Python.framework/Python
          test -L build/sidecars/markitdown-darwin-arm64/workwise-markitdown/_internal/Python.framework/Versions/Current
          test -L build/sidecars/markitdown-darwin-x64/workwise-markitdown/_internal/Python.framework/Python
          test -L build/sidecars/markitdown-darwin-x64/workwise-markitdown/_internal/Python.framework/Versions/Current
          chmod 755 build/sidecars/markitdown-darwin-arm64/workwise-markitdown/workwise-markitdown
          chmod 755 build/sidecars/markitdown-darwin-x64/workwise-markitdown/workwise-markitdown

      - name: Verify both macOS sidecars
        run: |
          WORKWISE_SIDECAR_ARCH=arm64 node scripts/build-markitdown-sidecar.mjs --verify-only
          WORKWISE_SIDECAR_ARCH=x64 node scripts/build-markitdown-sidecar.mjs --verify-only

      - name: Verify managed CLI upstreams on macOS
        run: npm run test:managed-tools:live

      - name: Resolve signing mode
        id: signing
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CODESIGN_P12_BASE64:-}" \
                && -n "${CSC_KEY_PASSWORD:-}" \
                && -n "${APPLE_API_KEY_BASE64:-}" \
                && -n "${APPLE_API_KEY_ID:-}" \
                && -n "${APPLE_API_ISSUER:-}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Apple signing credentials present: building a signed, notarized package."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::Stable macOS publication requires Developer ID signing and Apple notarization credentials."
              exit 1
            fi
            echo "::warning::Candidate build is unsigned and cannot be promoted to Stable."
          fi

      - name: Decode Apple signing credentials
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          export CERT_PATH="${cert_path}"
          export KEY_PATH="${key_path}"

          node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.MAC_CODESIGN_P12_BASE64, 'base64'))
          fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))
          NODE

          {
            echo "CSC_LINK=${cert_path}"
            echo "APPLE_API_KEY=${key_path}"
            echo "MAC_SIGN=1"
          } >> "${GITHUB_ENV}"

      - name: Verify Apple signing credentials
        if: steps.signing.outputs.enabled == 'true'
        run: >
          npm run verify:apple -- --p12 "${CSC_LINK}"
          --p12-password "${CSC_KEY_PASSWORD}"
          --p8 "${APPLE_API_KEY}"
          --key-id "${APPLE_API_KEY_ID}"
          --issuer "${APPLE_API_ISSUER}"
          --check-notary

      - name: Build signed macOS packages
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/with-mac-signing-keychain.mjs npm run dist:mac:signed

      - name: Build unsigned macOS packages
        if: steps.signing.outputs.enabled != 'true'
        run: npm run dist:mac

      - name: Verify MarkItDown is packaged in both macOS applications
        run: node scripts/verify-packaged-markitdown.cjs dist mac

      - name: Verify packaged macOS Runtime native dependency
        run: node scripts/verify-packaged-runtime-native.cjs dist mac

      - name: Generate macOS update metadata
        run: node ./scripts/generate-mac-latest.cjs dist

      - name: Verify final signed macOS artifacts
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/verify-mac-release-artifacts.cjs dist arm64 x64

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/WorkWise-*-mac-*.dmg
            dist/WorkWise-*-mac-*.zip
            dist/latest-mac.yml

  build-windows:
    name: Build Windows
    if: ${{ always() && needs.build-document-sidecars.result == 'success' && (needs.stability.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_stability == true)) }}
    # node-gyp 11.x supports the VS 2022 toolchain used to rebuild
    # better-sqlite3 for Electron ABI 148. Pin the release image so a
    # windows-latest Visual Studio upgrade cannot break installer builds.
    runs-on: windows-2022
    needs: [prepare, stability, build-document-sidecars]
    env:
      WORKWISE_APP_VERSION: ${{ needs.prepare.outputs.version }}
      WORKWISE_UPDATE_CHANNEL: ${{ inputs.candidate_only == true && 'frontier' || 'stable' }}
      WORKWISE_UPDATE_URL: ${{ inputs.candidate_only == true && 'https://127.0.0.1/' || '' }}
      WORKWISE_REQUIRE_DOCUMENT_SIDECAR: '1'
      RELEASE_CHANNEL: stable
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare checksummed Electron runtime
        run: npm run prepare:electron

      - name: Download Windows MarkItDown sidecar
        uses: actions/download-artifact@v4
        with:
          name: markitdown-win32-x64
          path: build/sidecars/markitdown-win32-x64

      - name: Verify Windows sidecar
        run: node scripts/build-markitdown-sidecar.mjs --verify-only
        env:
          WORKWISE_SIDECAR_ARCH: x64

      - name: Verify managed CLI upstreams on Windows
        run: npm run test:managed-tools:live

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify MarkItDown is packaged in the Windows application
        run: node scripts/verify-packaged-markitdown.cjs dist win

      - name: Verify packaged Windows Runtime native dependency
        run: node scripts/verify-packaged-runtime-native.cjs dist win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/WorkWise-*-win-x64.exe
            dist/WorkWise-*-win-x64.exe.blockmap
            dist/latest.yml

  publish:
    name: Publish GitHub Release
    if: ${{ always() && github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.candidate_only == true) && needs.prepare.result == 'success' && needs.build-document-sidecars.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && (needs.stability.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_stability == true)) }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - stability
      - build-document-sidecars
      - build-macos
      - build-windows
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      RELEASE_CHANNEL: stable
      WORKWISE_UPDATE_CHANNEL: stable
      MAC_SIGNED: ${{ secrets.MAC_CODESIGN_P12_BASE64 != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
      WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
      WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
      WORKWISE_WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WORKWISE_WEBSITE_SSH_PRIVATE_KEY }}
      WORKWISE_WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS }}
      WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
      WORKWISE_PUBLIC_BASE_URL: https://www.railwise.cn/downloads
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Prepare public installer names
        run: |
          set -euo pipefail
          rm -rf public-release-assets
          mkdir -p public-release-assets

          copy_one() {
            local pattern="$1"
            local target="$2"
            mapfile -t matches < <(compgen -G "release-artifacts/${pattern}" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one artifact matching ${pattern}, found ${#matches[@]}"
              find release-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
            cp "${matches[0]}" "public-release-assets/${target}"
          }

          copy_one "WorkWise-*-mac-arm64.dmg" "WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg"
          copy_one "WorkWise-*-mac-x64.dmg" "WorkWise-${RELEASE_VERSION}-mac-Intel.dmg"
          copy_one "WorkWise-*-win-x64.exe" "WorkWise-${RELEASE_VERSION}-win-x64.exe"

          find public-release-assets -maxdepth 1 -type f -print | sort

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          required=(
            "WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg"
            "WorkWise-${RELEASE_VERSION}-mac-Intel.dmg"
            "WorkWise-${RELEASE_VERSION}-win-x64.exe"
          )

          for file in "${required[@]}"; do
            if [[ ! -s "public-release-assets/${file}" ]]; then
              echo "::error::Missing release artifact ${file}"
              find public-release-assets -maxdepth 1 -type f -print | sort
              exit 1
            fi
          done

          find public-release-assets -maxdepth 1 -type f -print | sort

      - name: Verify Stable delivery credentials
        run: |
          set -euo pipefail
          [[ "${MAC_SIGNED}" == "true" ]] || { echo "::error::Stable requires signed and notarized macOS packages"; exit 1; }
          for name in \
            R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            WORKWISE_WEBSITE_SSH_HOST WORKWISE_WEBSITE_SSH_PORT WORKWISE_WEBSITE_SSH_USER \
            WORKWISE_WEBSITE_SSH_PRIVATE_KEY WORKWISE_WEBSITE_SSH_KNOWN_HOSTS WORKWISE_WEBSITE_RELEASE_ROOT; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing ${name}; Stable promotion is blocked"; exit 1; }
          done

      - name: Prepare website update channel assets
        run: |
          set -euo pipefail
          node ./scripts/prepare-website-release-assets.cjs \
            release-artifacts \
            website-release-assets \
            "${RELEASE_VERSION}" \
            --channel stable \
            --release-prefix workwise \
            --public-base-url "${WORKWISE_PUBLIC_BASE_URL}"

          node ./scripts/verify-release-assets.cjs website-release-assets --write-sha256 SHA256SUMS.txt

      - name: Prepare pinned website SSH transport
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/workwise-website-ssh"
          install -d -m 700 "${ssh_dir}"
          export SSH_KEY_PATH="${ssh_dir}/deploy-key"
          export SSH_KNOWN_HOSTS_PATH="${ssh_dir}/known_hosts"
          node - <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.SSH_KEY_PATH, `${process.env.WORKWISE_WEBSITE_SSH_PRIVATE_KEY.trim()}\n`, { mode: 0o600 })
          fs.writeFileSync(process.env.SSH_KNOWN_HOSTS_PATH, `${process.env.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS.trim()}\n`, { mode: 0o600 })
          NODE
          {
            echo "WORKWISE_WEBSITE_SSH_KEY_PATH=${SSH_KEY_PATH}"
            echo "WORKWISE_WEBSITE_SSH_KNOWN_HOSTS_PATH=${SSH_KNOWN_HOSTS_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Upload immutable updater artifacts to R2
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs upload --platform mac --tag "${TAG_NAME}" --channel stable --dist release-artifacts
          node ./scripts/publish-r2.mjs upload --platform win --tag "${TAG_NAME}" --channel stable --dist release-artifacts

      - name: Verify immutable R2 updater artifacts
        run: |
          set -euo pipefail
          node ./scripts/verify-release-assets.cjs release-artifacts
          node ./scripts/publish-r2.mjs verify --tag "${TAG_NAME}" --channel stable --platforms mac,win

      - name: Stage immutable release on the official website
        run: |
          set -euo pipefail
          node ./scripts/deploy-website-release.mjs stage \
            --source website-release-assets \
            --tag "${TAG_NAME}" \
            --channel stable \
            --release-prefix workwise \
            --deploy-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --transport r2

      - name: Verify official immutable HTTPS downloads
        run: |
          set -euo pipefail
          node ./scripts/deploy-website-release.mjs verify-public \
            --source website-release-assets \
            --tag "${TAG_NAME}" \
            --channel stable \
            --release-prefix workwise \
            --target release

      - name: Promote verified R2 and official website latest pointers
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs promote --tag "${TAG_NAME}" --channel stable --platforms mac,win
          node ./scripts/deploy-website-release.mjs promote \
            --tag "${TAG_NAME}" \
            --channel stable \
            --release-prefix workwise \
            --deploy-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify promoted official updater feed
        run: |
          set -euo pipefail
          node ./scripts/deploy-website-release.mjs verify-public \
            --source website-release-assets \
            --tag "${TAG_NAME}" \
            --channel stable \
            --release-prefix workwise \
            --target latest

      - name: Upload website update channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-website
          if-no-files-found: error
          retention-days: 7
          path: |
            website-release-assets/*

      - name: Generate release notes
        run: |
          set -euo pipefail
          curated_notes="release/release-${TAG_NAME}.md"
          if [[ -s "${curated_notes}" ]]; then
            cp "${curated_notes}" release-notes.md
          elif [[ -n "${PREVIOUS_TAG}" ]]; then
            node ./scripts/generate-release-notes.cjs "${PREVIOUS_TAG}" > release-notes.md
          else
            node ./scripts/generate-release-notes.cjs > release-notes.md
          fi

          if [[ "${MAC_SIGNED}" == "true" ]]; then
            mac_line="- macOS: Developer ID signed and notarized"
          else
            mac_line="- macOS: UNSIGNED build — run \`xattr -dr com.apple.quarantine /Applications/RailWise AI.app\` (or scripts/mac-unquarantine.sh) before first launch"
          fi

          {
            echo
            echo "---"
            echo
            echo "### 构建信息"
            echo
            echo "- Release version: \`${RELEASE_VERSION}\`"
            echo "- Release channel: \`${RELEASE_CHANNEL}\`"
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "${mac_line}"
            echo "- macOS Apple Silicon: \`WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg\`"
            echo "- macOS Intel: \`WorkWise-${RELEASE_VERSION}-mac-Intel.dmg\`"
            echo "- Windows x64: \`WorkWise-${RELEASE_VERSION}-win-x64.exe\`"
          } >> release-notes.md

      - name: Create or update draft GitHub Release
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Keep GitHub Release limited to the three client installers
        run: |
          set -euo pipefail
          required=(
            "WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg"
            "WorkWise-${RELEASE_VERSION}-mac-Intel.dmg"
            "WorkWise-${RELEASE_VERSION}-win-x64.exe"
          )

          # GitHub Releases retain assets when a workflow is re-run. Remove
          # old zips, blockmaps, checksums, and update metadata before adding
          # the three user-facing installers. Update metadata remains in the
          # internal website-channel artifact for a future external update feed.
          # Draft releases are not returned by the REST `releases/tags/:tag`
          # endpoint. Read the release through the gh CLI instead so the
          # cleanup also works on the first publish attempt.
          mapfile -t existing < <(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name')
          for asset in "${existing[@]}"; do
            keep=false
            for file in "${required[@]}"; do
              [[ "${asset}" == "${file}" ]] && keep=true
            done
            if [[ "${keep}" != true ]]; then
              gh release delete-asset "${TAG_NAME}" "${asset}" --yes
            fi
          done

          assets=()
          for file in "${required[@]}"; do
            assets+=("public-release-assets/${file}")
          done

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No client installers found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

      - name: Verify GitHub Release downloads
        run: |
          set -euo pipefail
          mkdir downloaded-release
          gh release download "${TAG_NAME}" \
            --dir downloaded-release \
            --pattern 'WorkWise-*' \
            --clobber
          required=(
            "WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg"
            "WorkWise-${RELEASE_VERSION}-mac-Intel.dmg"
            "WorkWise-${RELEASE_VERSION}-win-x64.exe"
          )
          for file in "${required[@]}"; do
            test -s "downloaded-release/${file}" || {
              echo "::error::Missing downloaded release asset ${file}"
              find downloaded-release -maxdepth 1 -type f -print | sort
              exit 1
            }
          done
          test "$(find downloaded-release -maxdepth 1 -type f -name 'WorkWise-*' | wc -l | tr -d ' ')" = 3

      - name: Publish GitHub Release
        run: gh release edit "${TAG_NAME}" --draft=false --prerelease=false --latest

  verify-candidate:
    name: Verify three-client candidate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.candidate_only == true && needs.prepare.result == 'success' && needs.build-document-sidecars.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && (needs.stability.result == 'success' || inputs.skip_stability == true) }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - stability
      - build-document-sidecars
      - build-macos
      - build-windows
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: candidate-artifacts
          merge-multiple: true

      - name: Verify update metadata and select three clients
        run: |
          set -euo pipefail
          node ./scripts/verify-release-assets.cjs candidate-artifacts
          rm -rf candidate-installers
          mkdir -p candidate-installers

          copy_one() {
            local pattern="$1"
            local target="$2"
            mapfile -t matches < <(compgen -G "candidate-artifacts/${pattern}" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one artifact matching ${pattern}, found ${#matches[@]}"
              find candidate-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
            cp "${matches[0]}" "candidate-installers/${target}"
          }

          copy_one "WorkWise-*-mac-arm64.dmg" "WorkWise-${RELEASE_VERSION}-mac-Apple-Silicon.dmg"
          copy_one "WorkWise-*-mac-x64.dmg" "WorkWise-${RELEASE_VERSION}-mac-Intel.dmg"
          copy_one "WorkWise-*-win-x64.exe" "WorkWise-${RELEASE_VERSION}-win-x64.exe"

          (cd candidate-installers && sha256sum WorkWise-* > SHA256SUMS.txt)
          test "$(find candidate-installers -maxdepth 1 -type f -name 'WorkWise-*' | wc -l | tr -d ' ')" = "3"

      - name: Upload verified three-client candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-installers-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: candidate-installers/*

  verify-candidate-macos:
    name: Verify final candidate on macOS
    if: ${{ always() && needs.verify-candidate.result == 'success' }}
    runs-on: macos-26
    needs:
      - prepare
      - verify-candidate
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download final candidate installers
        uses: actions/download-artifact@v4
        with:
          name: candidate-installers-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: candidate-installers

      - name: Verify final candidate DMGs
        run: node scripts/verify-mac-release-artifacts.cjs candidate-installers --dmg-only arm64 x64
